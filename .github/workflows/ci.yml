name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Lint (ruff)
        run: uv run --with ruff python -m ruff check .

      - name: Type check (mypy)
        run: uv run --with mypy --with pyyaml python -m mypy .

      - name: Tests (CI-safe subset)
        # Heavy tests (torch/CUDA/audio hardware) are marked "local" and run
        # on the maintainer's machine before each release instead.
        run: >-
          uv run --with pytest --with pyyaml --with openai --with httpx --with pysbd --with numpy
          python -m pytest tests/ -q -m "not local"

  torch-free:
    # The base profile must stay installable and runnable without torch:
    # install requirements.txt into a clean venv, prove no torch sneaks in,
    # import every GUI-process module, and run the VAD on the vendored ONNX
    # model (in-repo, so no model download happens here).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install base profile (no torch)
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/Scripts/python.exe -r requirements.txt
          uv pip install --python .venv/Scripts/python.exe pytest

      - name: Assert torch is absent
        run: |
          .venv/Scripts/python.exe -c "import importlib.util, sys; sys.exit(1 if importlib.util.find_spec('torch') else 0)"

      - name: Import smoke + ONNX VAD path
        run: .venv/Scripts/python.exe scripts/smoke_torch_free.py

      - name: Silero ONNX tests
        # importorskip-guarded elsewhere; in this venv onnxruntime and PyQt6
        # exist, so the wrapper-contract and guard-dialog tests actually run.
        run: .venv/Scripts/python.exe -m pytest tests/unit/test_silero_onnx.py tests/unit/test_model_manager.py tests/unit/test_engine_switch_guard.py tests/unit/test_capture_backends.py tests/unit/test_click_through_dispatch.py tests/unit/test_overlay_tool_window.py tests/unit/test_mem_threshold_check.py -q -m "not local"

  torch-free-mac:
    # The macOS Lightweight profile must stay installable and importable:
    # platform markers pull the mac trio (sounddevice + pyobjc) and drop
    # PyAudioWPatch, the capture shim must dispatch to the mac backend on a
    # machine with no BlackHole (empty device list, no crash), and the shell
    # scripts must be exactly what a user's /bin/bash (Apple bash 3.2) parses.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Shell script guards (bash 3.2 parse, shellcheck, LF, exec bit)
        run: |
          for f in install.sh start.sh update.sh; do
            head -1 "$f" | grep -q '^#!/usr/bin/env bash' || { echo "$f: bad shebang"; exit 1; }
            grep -q $'\r' "$f" && { echo "$f: CRLF line endings"; exit 1; }
            [ -x "$f" ] || { echo "$f: missing executable bit"; exit 1; }
            /bin/bash -n "$f" || { echo "$f: does not parse under Apple bash 3.2"; exit 1; }
          done
          brew install shellcheck
          shellcheck --shell=bash install.sh start.sh update.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install base profile (no torch)
        # --clear: setup-uv's python-version input pre-creates .venv on the
        # macOS runner, and a bare `uv venv` refuses to overwrite it.
        run: |
          uv venv --python 3.12 --clear .venv
          uv pip install --python .venv/bin/python -r requirements.txt
          uv pip install --python .venv/bin/python pytest

      - name: Assert torch is absent and the mac capture trio is present
        run: |
          .venv/bin/python -c "import importlib.util, sys; sys.exit(1 if importlib.util.find_spec('torch') else 0)"
          .venv/bin/python -c "import sounddevice, objc, AppKit"
          .venv/bin/python -c "import importlib.util, sys; sys.exit(1 if importlib.util.find_spec('pyaudiowpatch') else 0)"

      - name: Import smoke + ONNX VAD path
        run: .venv/bin/python scripts/smoke_torch_free.py

      - name: Capture dispatch resolves to the mac backend, device query is crash-safe
        run: .venv/bin/python -c "from sublume.core.audio_capture import AudioCapture, list_output_devices; import sublume.core.capture.macos as mac; assert AudioCapture is mac.AudioCapture, 'dispatch picked the wrong backend'; print('sources on this runner:', list_output_devices()); print('has_blackhole:', mac.has_blackhole())"

      - name: Click-through dispatch resolves to the mac backend
        # The only guard on macos.py's import line: Windows mypy/pytest narrow
        # sys.platform and never see it.
        run: .venv/bin/python -c "from sublume.ui.overlay import click_through; import sublume.ui.overlay.macos as macos; assert click_through.set_click_through is macos.set_click_through, 'dispatch picked the wrong backend'; print('click-through backend is macos')"

      - name: pyobjc pointer roundtrip (objc_object(c_void_p=...) contract)
        # Wraps an address that has NO live Python proxy - the object is kept
        # alive only by an ObjC container, its proxy dropped and collected
        # first. That is the backend's real case (winId() is a C++-created
        # NSView pyobjc has never seen); wrapping a freshly proxied object
        # would only prove the proxy cache works. Wrap BEFORE touching the
        # holder, which would re-proxy the object.
        run: .venv/bin/python -c "from Foundation import NSObject, NSMutableArray; import objc, ctypes, gc; holder = NSMutableArray.alloc().init(); o = NSObject.alloc().init(); holder.addObject_(o); addr = objc.pyobjc_id(o); del o; gc.collect(); o2 = objc.objc_object(c_void_p=ctypes.c_void_p(addr)); assert objc.pyobjc_id(o2) == addr, 'pointer roundtrip lost identity'; print('roundtrip ok:', o2.description())"

      - name: Unit tests (onnx + capture + click-through + tool window + guard)
        # test_overlay_tool_window really exercises the darwin branch here:
        # sys.platform is darwin natively, so the WA_MacAlwaysShowToolWindow
        # assertion is not just a monkeypatched simulation.
        run: .venv/bin/python -m pytest tests/unit/test_silero_onnx.py tests/unit/test_model_manager.py tests/unit/test_engine_switch_guard.py tests/unit/test_capture_backends.py tests/unit/test_click_through_dispatch.py tests/unit/test_overlay_tool_window.py tests/unit/test_mem_threshold_check.py -q -m "not local"
