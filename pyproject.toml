[project]
name = "sublume"
version = "2026.8.0"
description = "Real-time system-audio translation overlay for Windows (fork of TheDeathDragon/LiveTranslate)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored model code is not ours to lint.
exclude = ["funasr_nano"]

[tool.ruff.lint]
# E402 ignored on purpose: torch must be imported before PyQt6 (see main.py).
# E501 handled loosely during the incremental refactor; new code should comply.
select = ["F", "E", "W"]
ignore = ["E501", "E402"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
# Legacy modules are exempted below (baseline); new modules must type-check.
check_untyped_defs = false

[[tool.mypy.overrides]]
# Baseline exemption for the pre-fork monolith files. Shrink this list as
# Phase 3 splits and annotates them; never add new modules here.
module = [
    "main",
    "sublume.main",
    "sublume.benchmark",
    "sublume.core.*",
    # moved legacy monolith code (Phase 3); un-baseline when annotated
    # (sublume.core.pipeline is already covered by sublume.core.*
    # above; listed explicitly so it is un-baselined with the rest of the batch)
    "sublume.core.pipeline",
    "sublume.asr.supervisor",
    "sublume.asr.engine_switch",
    "sublume.asr.client",
    "sublume.asr.server",
    "sublume.asr.worker",
    "sublume.asr.whisper",
    "sublume.asr.sensevoice",
    "sublume.asr.funasr",
    "sublume.asr.funasr_nano",
    "sublume.asr.anime_whisper",
    "sublume.asr.remote",
    "sublume.translation.translator",
    "sublume.ui.*",
    "sublume.i18n",
    "funasr_nano.*",
    "test_audio",
]
ignore_errors = true

[[tool.mypy.overrides]]
# New modules pulled back out of the baseline globs above (more specific
# patterns win): M3-2 split (ui.dialogs, ui.changelog) and the torch-free
# VAD path (core.silero_onnx).
module = [
    "sublume.ui.dialogs.*",
    "sublume.ui.changelog",
    "sublume.core.silero_onnx",
    # capture package: __init__/base/macos are new and type-check; windows.py
    # is the legacy monolith moved verbatim and stays under the core.* baseline.
    "sublume.core.capture",
    "sublume.core.capture.base",
    "sublume.core.capture.macos",
    # overlay click-through: the platform shim and the new macOS backend
    # (win32.py is legacy and stays under the sublume.ui.* baseline).
    "sublume.ui.overlay.click_through",
    "sublume.ui.overlay.macos",
]
ignore_errors = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "local: needs heavy local deps (torch/CUDA) or hardware; excluded in CI",
]
